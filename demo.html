<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AtendePro IA | Teste a demonstração</title>

    <meta name="description"
        content="Teste o atendimento inteligente da AtendePro IA diretamente no seu navegador.">

    <link rel="stylesheet" href="style.css">

    <style>
        .demo-page {
            min-height: 100vh;
            padding: 110px 5% 70px;
        }

        .demo-header {
            max-width: 850px;
            margin: 0 auto 35px;
            text-align: center;
        }

        .demo-header .tag {
            display: inline-block;
            margin-bottom: 18px;
        }

        .demo-header h1 {
            margin-bottom: 15px;
        }

        .demo-header h1 span {
            color: #a855f7;
        }

        .demo-header p {
            max-width: 680px;
            margin: 0 auto;
        }

        .webchat-container {
            width: min(900px, 100%);
            height: 720px;
            margin: 0 auto;
            overflow: hidden;
            border-radius: 18px;
        }

        .webchat-container iframe {
            display: block;
            width: 100%;
            height: 100%;
            min-height: 700px;
            border: 0;
        }

        .demo-back {
            display: block;
            width: fit-content;
            margin: 30px auto 0;
            text-decoration: none;
        }

        @media (max-width: 700px) {

            .demo-page {
                padding: 90px 15px 40px;
            }

            .demo-header h1 {
                font-size: 32px;
            }

            .webchat-container {
                height: 680px;
            }

        }
    </style>
</head>

<body>

    <!-- HEADER -->

    <header>

        <a href="index.html" class="logo">
            Atende<span>Pro</span> IA
        </a>

        <nav>
            <a href="index.html#solucao">Solução</a>
            <a href="index.html#recursos">Recursos</a>
            <a href="index.html#como-funciona">Como funciona</a>
        </nav>

           class="btn btn-small"
           target="_blank"
           rel="noopener noreferrer">
            Falar conosco
        </a>

    </header>


    <!-- DEMONSTRAÇÃO -->

    <main class="demo-page">

        <div class="demo-header">

            <span class="tag">
                ✦ TESTE GRATUITAMENTE
            </span>

                Experimente o <span>AtendePro IA</span>
            </h1>

                como ela pode responder dúvidas, apresentar serviços e
                realizar o primeiro atendimento dos seus clientes.
            </p>

        </div>


        <!-- WEB CHAT GPT MAKER -->

        <div class="webchat-container">

            <iframe
                src="https://app.gptmaker.ai/widget/3F97A50EF0A023D3A040C60EC3422842/iframe"
                width="100%"
                style="height: 100%; min-height: 700px"
                allow="microphone;"
                frameborder="0">
            </iframe>

        </div>


        <!-- VOLTAR -->

        <a href="index.html" class="demo-back">
            ← Voltar para o site
        </a>

    </main>


    <script src="script.js"></script>
